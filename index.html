<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Late Starters Fart Den</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 45px 20px 30px;
    text-align: center;
    background: #161b22;
    border-bottom: 3px solid #4ade80;
}

header h1 {
    margin: 0;
    font-size: clamp(32px, 6vw, 54px);
    text-transform: uppercase;
}

header p {
    color: #9ca3af;
    margin-bottom: 0;
}

nav {
    background: #090c10;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 16px;
}

nav a {
    color: #ddd;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #4ade80;
}

main {
    width: min(1100px, 92%);
    margin: 35px auto;
}

.section {
    margin-bottom: 45px;
}

.section-title {
    margin-bottom: 15px;
    font-size: 25px;
}

.league-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 22px;
}

.status {
    color: #4ade80;
    font-weight: bold;
}

.standings {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
}

.standings-row {
    display: grid;
    grid-template-columns: 55px 1fr 100px 110px;
    align-items: center;
    padding: 15px 18px;
    border-bottom: 1px solid #30363d;
}

.standings-row:last-child {
    border-bottom: none;
}

.standings-header {
    background: #21262d;
    color: #9ca3af;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
}

.rank {
    font-weight: bold;
    color: #4ade80;
}

.team {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #30363d;
    object-fit: cover;
}

.team-name {
    font-weight: bold;
}

.manager {
    color: #8b949e;
    font-size: 13px;
    margin-top: 3px;
}

.record {
    font-weight: bold;
}

.points {
    text-align: right;
}

.loading {
    color: #8b949e;
    padding: 20px;
}

.error {
    color: #f87171;
}

footer {
    text-align: center;
    color: #6e7681;
    padding: 30px;
    font-size: 13px;
}

@media (max-width: 650px) {

    .standings-row {
        grid-template-columns: 35px 1fr 60px 75px;
        padding: 13px 10px;
    }

    .avatar {
        width: 34px;
        height: 34px;
    }

    .manager {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header>
    <h1 id="league-name">Loading League...</h1>
    <p id="league-details">Connecting to Sleeper...</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#standings">Standings</a>
    <a href="#">Matchups</a>
    <a href="#">Teams</a>
    <a href="#">Power Rankings</a>
    <a href="#">History</a>
</nav>

<main>

<section class="section">

    <h2 class="section-title">League Headquarters</h2>

    <div class="league-card">

        <p id="connection-status">
            Connecting to Sleeper...
        </p>

        <p id="league-summary">
            Loading league information...
        </p>

    </div>

</section>


<section class="section" id="standings">

    <h2 class="section-title">🏆 Standings</h2>

    <div class="standings">

        <div class="standings-row standings-header">
            <div>RK</div>
            <div>Team</div>
            <div>Record</div>
            <div class="points">PF</div>
        </div>

        <div id="standings-body">
            <div class="loading">Loading standings...</div>
        </div>

    </div>

</section>

</main>

<footer>
    Late Starters Fart Den • Powered by Sleeper
</footer>


<script>

const LEAGUE_ID = "1313301144683958272";

const API = "https://api.sleeper.app/v1";


async function sleeper(endpoint) {

    const response = await fetch(`${API}${endpoint}`);

    if (!response.ok) {
        throw new Error(`Sleeper API error: ${response.status}`);
    }

    return response.json();
}


function getPointsFor(settings = {}) {

    const points =
        Number(settings.fpts || 0) +
        Number(settings.fpts_decimal || 0) / 100;

    return points;
}


function getPointsAgainst(settings = {}) {

    const points =
        Number(settings.fpts_against || 0) +
        Number(settings.fpts_against_decimal || 0) / 100;

    return points;
}


function getAvatar(user) {

    if (!user || !user.avatar) {
        return "";
    }

    return `https://sleepercdn.com/avatars/thumbs/${user.avatar}`;
}


async function loadSite() {

    try {

        const [league, users, rosters] = await Promise.all([

            sleeper(`/league/${LEAGUE_ID}`),

            sleeper(`/league/${LEAGUE_ID}/users`),

            sleeper(`/league/${LEAGUE_ID}/rosters`)

        ]);


        /* -----------------------------
           LEAGUE INFORMATION
        ------------------------------ */

        document.getElementById("league-name").textContent =
            league.name || "Fantasy Football League";


        document.getElementById("league-details").textContent =
            `${league.season} Season • ${league.total_rosters} Teams`;


        document.getElementById("connection-status").innerHTML =
            `<span class="status">✓ LIVE SLEEPER DATA</span>`;


        document.getElementById("league-summary").textContent =
            `League status: ${league.status || "Unknown"}`;



        /* -----------------------------
           CREATE USER LOOKUP
        ------------------------------ */

        const usersById = {};

        users.forEach(user => {
            usersById[user.user_id] = user;
        });



        /* -----------------------------
           CREATE STANDINGS
        ------------------------------ */

        const standings = rosters.map(roster => {

            const owner =
                usersById[roster.owner_id] || {};


            const teamName =
                owner.metadata?.team_name ||
                owner.display_name ||
                `Team ${roster.roster_id}`;


            return {

                rosterId: roster.roster_id,

                teamName,

                manager:
                    owner.display_name ||
                    "Unknown Manager",

                avatar:
                    getAvatar(owner),

                wins:
                    roster.settings?.wins || 0,

                losses:
                    roster.settings?.losses || 0,

                ties:
                    roster.settings?.ties || 0,

                pointsFor:
                    getPointsFor(roster.settings),

                pointsAgainst:
                    getPointsAgainst(roster.settings)

            };

        });



        /* -----------------------------
           SORT STANDINGS
           
           1. Wins
           2. Points For
        ------------------------------ */

        standings.sort((a, b) => {

            if (b.wins !== a.wins) {
                return b.wins - a.wins;
            }

            return b.pointsFor - a.pointsFor;

        });



        /* -----------------------------
           DISPLAY STANDINGS
        ------------------------------ */

        const standingsBody =
            document.getElementById("standings-body");


        standingsBody.innerHTML = "";


        standings.forEach((team, index) => {

            const row =
                document.createElement("div");


            row.className =
                "standings-row";


            const record =
                team.ties > 0
                    ? `${team.wins}-${team.losses}-${team.ties}`
                    : `${team.wins}-${team.losses}`;


            const avatarHTML =
                team.avatar
                    ? `<img class="avatar"
                         src="${team.avatar}"
                         alt="">`
                    : `<div class="avatar"></div>`;


            row.innerHTML = `

                <div class="rank">
                    ${index + 1}
                </div>

                <div class="team">

                    ${avatarHTML}

                    <div>

                        <div class="team-name">
                            ${team.teamName}
                        </div>

                        <div class="manager">
                            ${team.manager}
                        </div>

                    </div>

                </div>

                <div class="record">
                    ${record}
                </div>

                <div class="points">
                    ${team.pointsFor.toFixed(2)}
                </div>

            `;


            standingsBody.appendChild(row);

        });


    } catch (error) {

        console.error(error);


        document.getElementById(
            "connection-status"
        ).innerHTML =
            `<span class="error">
                Unable to connect to Sleeper.
             </span>`;


        document.getElementById(
            "standings-body"
        ).innerHTML =
            `<div class="loading error">
                Couldn't load standings.
             </div>`;

    }

}


loadSite();

</script>

</body>
</html>
